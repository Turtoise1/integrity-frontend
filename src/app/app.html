<h3>Upload folder</h3>
<form enctype="multipart/form-data">
  <input type="file" name="file" multiple webkitdirectory />
</form>
<h3>Preserve uploaded data</h3>
<form>
  <p-select [(ngModel)]="selectedPath" [options]="paths()" name="path-select"></p-select>
  <p-button (click)="preserve()">Preserve</p-button>
</form>
<p-toast />
